services:
  postgres:
    image: postgres:17-alpine
    container_name: interviewprep-postgres
    environment:
      POSTGRES_DB: interviewprep
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME must be set in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d interviewprep"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
