spring.application.name=be-interview-prep
server.port=${SERVER_PORT:8080}

# Local secrets live in .env (git-ignored); real environment variables take precedence.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/interviewprep}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# File uploads (Q3). Spring rejects larger uploads before the controller; FileService re-checks.
spring.servlet.multipart.max-file-size=${FILE_MAX_SIZE:5MB}
spring.servlet.multipart.max-request-size=${FILE_MAX_REQUEST_SIZE:6MB}
app.files.storage-location=${FILE_STORAGE_DIR:./uploads}
