# Separate database so tests never touch local development data.
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5433/interviewprep_test}

spring.jpa.hibernate.ddl-auto=create-drop

# Keep test uploads out of the project root; wiped by mvn clean.
app.files.storage-location=target/test-uploads

# Pin booking settings so a developer's .env (CLINIC_TIME_ZONE, BOOKING_HOLD_DURATION) can't change test results.
app.booking.zone=UTC
app.booking.hold-duration=5m
